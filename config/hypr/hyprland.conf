# hyprland.conf — Omarchy-style Hyprland for Fedora
# https://wiki.hyprland.org/Configuring/

# monitor — change this for your setup
# example: monitor = DP-1, 2560x1440@165, 0x0, 1.25
monitor = , preferred, auto, 1

# autostart
exec-once = waybar
exec-once = dunst
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent || /usr/libexec/hyprpolkitagent
exec-once = swaybg -c '#1a1b26'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt5ct

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(7aa2f7) rgb(bb9af7) 45deg
    col.inactive_border = rgb(24283b)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
    }
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a2eee)
    }
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 40, default, loop
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# window rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, class:^(omacalc)$
windowrulev2 = float, class:^(hyprland-preview-share-picker)$
windowrulev2 = opacity 0.92 0.88, class:^(foot)$
windowrulev2 = opacity 0.95 0.90, class:^(Code)$
windowrulev2 = opacity 0.95 0.90, class:^(code-url-handler)$

# keybindings
$mainMod = SUPER
$scripts = ~/.config/hypr/scripts

# apps
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, SPACE, exec, rofi -show drun -show-icons
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, thunar
bind = $mainMod, C, exec, omacalc

# window management
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, T, togglesplit,

# focus (vim-style, semicolon for right since L is lock)
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, semicolon, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# move windows
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# resize
binde = $mainMod CTRL, h, resizeactive, -30 0
binde = $mainMod CTRL, j, resizeactive, 0 30
binde = $mainMod CTRL, k, resizeactive, 0 -30
binde = $mainMod CTRL, l, resizeactive, 30 0

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, Tab, workspace, previous

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# volume
bindle = , XF86AudioRaiseVolume, exec, $scripts/volume.sh up
bindle = , XF86AudioLowerVolume, exec, $scripts/volume.sh down
bindl  = , XF86AudioMute, exec, $scripts/volume.sh mute

# brightness
bindle = , XF86MonBrightnessUp, exec, $scripts/brightness.sh up
bindle = , XF86MonBrightnessDown, exec, $scripts/brightness.sh down

# screenshots
bind = , PRINT, exec, $scripts/screenshot.sh region
bind = $mainMod, PRINT, exec, $scripts/screenshot.sh full
bind = $mainMod SHIFT, PRINT, exec, $scripts/screenshot.sh window
