# hyprlock.conf — blurred screenshot lockscreen, Tokyo Night
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

# blurs a screenshot of whatever's on screen
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(c0caf5)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(7aa2f7)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

# password
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    fade_on_empty = false

    font_color = rgb(c0caf5)
    inner_color = rgb(1a1b26)
    outer_color = rgb(7aa2f7)
    check_color = rgb(bb9af7)
    fail_color = rgb(f7768e)
    capslock_color = rgb(e0af68)

    placeholder_text = <span foreground="##565f89">Enter Password...</span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -50
    halign = center
    valign = center
}
