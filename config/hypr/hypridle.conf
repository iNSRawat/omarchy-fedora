# hypridle.conf — dim -> lock -> dpms off -> suspend
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # don't spawn multiple instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # wake display on resume
}

# dim after 2.5 min
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# displays off after 5.5 min
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# suspend after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
