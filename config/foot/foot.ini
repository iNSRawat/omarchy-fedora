# foot.ini — Tokyo Night terminal
# https://codeberg.org/dnkl/foot

[main]
font=JetBrainsMono Nerd Font:size=11
pad=12x12
term=xterm-256color
dpi-aware=auto
initial-window-size-chars=120x35

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
search-start=Control+Shift+f
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0

[colors]
alpha=0.92
foreground=c0caf5
background=1a1b26

# normal
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

# bright
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[csd]
preferred=none
